<svg width="800" height="1000" viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="1000" fill="#e0e0e0" rx="25" ry="25"/>
  
  <!-- Decorative elements -->
  <rect x="50" y="50" width="700" height="700" fill="#f5f5f5" rx="15" ry="15" stroke="#2c3e50" stroke-width="3"/>
  
  <!-- Camera icon -->
  <circle cx="400" cy="350" r="150" fill="#34495e"/>
  <circle cx="400" cy="350" r="120" fill="#2c3e50"/>
  <circle cx="400" cy="350" r="80" fill="#1a2530"/>
  <circle cx="450" cy="300" r="15" fill="#f5f5f5"/>
  
  <!-- Photography frame marks -->
  <rect x="150" y="150" width="50" height="50" fill="#2c3e50" rx="5" ry="5"/>
  <rect x="600" y="150" width="50" height="50" fill="#2c3e50" rx="5" ry="5"/>
  <rect x="150" y="550" width="50" height="50" fill="#2c3e50" rx="5" ry="5"/>
  <rect x="600" y="550" width="50" height="50" fill="#2c3e50" rx="5" ry="5"/>
  
  <!-- Instruction Text -->
  <text x="400" y="800" font-family="Montserrat, sans-serif" font-size="50" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    Add Your Photo
  </text>
  <text x="400" y="860" font-family="Montserrat, sans-serif" font-size="30" text-anchor="middle" fill="#333333">
    Click to show why I love you and appreciate you
  </text>
</svg> 