<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Moments Template</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1 id="main-title">Memory Moments</h1>
            <p class="subtitle" id="subtitle">Click a card to reveal the story behind the photo</p>
        </header>

        <details class="template-editor">
            <summary>Open Template Editor</summary>
            <div class="editor-content">
                <h2>App Settings</h2>
                <label for="editor-page-title">Browser tab title</label>
                <input id="editor-page-title" type="text">

                <label for="editor-header-title">Main heading</label>
                <input id="editor-header-title" type="text">

                <label for="editor-subtitle">Subtitle</label>
                <input id="editor-subtitle" type="text">

                <label for="editor-footer-text">Footer text</label>
                <input id="editor-footer-text" type="text">

                <label for="editor-global-song">Global song filename or URL (optional)</label>
                <input id="editor-global-song" type="text">

                <div class="editor-divider"></div>

                <div class="editor-memory-header">
                    <h2>Memories</h2>
                    <button type="button" id="add-memory">Add Memory</button>
                </div>
                <div id="memory-editor-list"></div>

                <div class="editor-actions">
                    <button type="button" id="save-template">Save Template</button>
                    <button type="button" id="reset-template" class="danger">Reset to Defaults</button>
                </div>
                <p id="editor-feedback" class="editor-feedback" aria-live="polite"></p>
            </div>
        </details>

        <div class="memory-grid">
            <!-- Memory cards will be inserted here by JavaScript -->
        </div>
    </div>

    <footer>
        <p id="footer-text">Create your own memory collection</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
