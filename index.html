<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, minimal-ui">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Anthony</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1 id="main-title">Anthony</h1>
            <p class="subtitle">Click each card to reveal why Kait loves and appreciates you.<br>You can also share your favorite memory from each picture!</p>
        </header>

        <div class="memory-grid">
            <!-- Memory cards will be inserted here by JavaScript -->
        </div>
        
        <div class="share-section">
            <p class="share-instructions">Anthony's memories will be automatically saved and shared with Kait!</p>
            <div id="status-message">Connected and sharing memories</div>
        </div>
    </div>

    <div class="toast" id="toast-notification">Notification message here</div>

    <footer>
        <p>Made with love for you ❤️ Kait</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
